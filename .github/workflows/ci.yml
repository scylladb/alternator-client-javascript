name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IS_CICD: 1
  NPM_VERSION: 11.19.1
  SCYLLA_CCM_DIAGNOSTICS_DIR: .ccm-diagnostics
  SCYLLA_VERSION: release:2025.2.5

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Cache Scylla relocatable package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccm/scylla-repository
          key: scylla-ccm-relocatable-${{ runner.os }}-${{ runner.arch }}-release-2025.2.5

      - name: Run integration tests
        timeout-minutes: 60
        run: make test-all

      - name: Upload CCM diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: ccm-diagnostics-node-${{ matrix.node-version }}
          path: .ccm-diagnostics/**
          if-no-files-found: ignore
          include-hidden-files: true
