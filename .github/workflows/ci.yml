name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IS_CICD: 1
  NPM_VERSION: 11.19.1

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .docker-cache
          key: scylla-docker-${{ hashFiles('test/docker-compose.yml', 'Makefile') }}

      - name: Save Docker image to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: make docker-cache-save

      - name: Cache certificates
        id: cert-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cert-cache
          key: scylla-certs-${{ hashFiles('Makefile') }}

      - name: Save certificates to cache
        if: steps.cert-cache.outputs.cache-hit != 'true'
        run: make cert-cache-save

      - name: Run integration tests
        run: make test-all
